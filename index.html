splay='none';s.textContent='Signing in…';const{data,error}=await sb.auth.signInWithPassword({email:e.value.trim(),password:p.value});if(error){x.textContent=error.message;x.style.display='block';s.textContent='';return}location.replace('Perodua_Network_Management_Dashboard_Editable_Report.html')});</script></body></html>
